<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100%ドラ(ファンサイト) | 注目ポイント</title>
  <style>
    :root {
      --dora-blue: #2A7DE1;
      --dora-red: #E60012;
      --dora-yellow: #FFCC00;
      --dora-lightblue: #A3D8FF;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Sans", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.7;
      color: #333;
      background: linear-gradient(to bottom, #A3D8FF 0%, #f0f8ff 100%);
    }
    header {
      background: var(--dora-blue);
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
  
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      max-width: 1280px;
      margin: 0 auto;
      gap: 15px;
    }
    .logo { font-size: 1.75em; font-weight: bold; white-space: nowrap; }
    nav ul {
      list-style: none;
      display: flex;
      gap: 22px;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }
  
    nav a { color: white; text-decoration: none; font-weight: bold; }
    nav a:hover { color: var(--dora-yellow); }
    .lang-switch {
      display: flex;
      gap: 8px;
    }
    .lang-switch button {
      padding: 8px 14px;
      font-size: 0.9em;
      background: var(--dora-red);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      min-width: 70px;
    }
    .lang-switch button:hover { background: #ff3333; transform: scale(1.05); }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
  
    .modal-content {
      background: white;
      padding: 30px 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      border: 8px solid var(--dora-yellow);
      max-width: 420px;
      width: 90%;
    }
    .modal h3 {
      color: var(--dora-red);
      margin-bottom: 25px;
      font-size: 1.6em;
    }
    .modal button {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      font-size: 1.1em;
      background: var(--dora-lightblue);
      color: #003366;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .modal button:hover {
      background: var(--dora-yellow);
      transform: scale(1.03);
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 40px 20px; }
    
    .section-title {
      font-size: 2.6em;
      color: var(--dora-red);
      text-align: center;
      margin: 50px 0 60px;
      text-shadow: 3px 3px 0 var(--dora-yellow);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }
    .feature-card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 7px solid var(--dora-yellow);
      transition: all 0.3s;
      text-align: center;
    }
    .feature-card:hover {
      transform: translateY(-12px);
      border-color: var(--dora-red);
    }
    .feature-card img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin-bottom: 15px;
      border-radius: 15px;
    }
    .feature-card h3 {
      margin: 8px 0 6px;
      font-size: 1.45em;
    }
    .feature-card .source {
      display: block;
      font-size: 0.92em;
      color: #666;
      margin-bottom: 12px;
      font-weight: normal;
      line-height: 1.5;
    }
    .feature-card p {
      line-height: 1.8;
      color: #444;
      text-align: left;
    }

    .explore-more {
      text-align: center;
      margin: 70px 0 40px;
      font-size: 1.35em;
      color: var(--dora-red);
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 45px 20px;
      background: var(--dora-blue);
      color: white;
      margin-top: 80px;
    }

    @media screen and (max-width: 768px) {
      .top-bar { padding: 10px 12px; gap: 10px; flex-wrap: wrap; }
      .logo { font-size: 1.45em; }
      nav ul { gap: 12px; font-size: 0.92em; order: 3; width: 100%; justify-content: center; }
      .lang-switch { order: 2; }
      .lang-switch button { padding: 6px 10px; font-size: 0.82em; min-width: 58px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top-bar">
<div class="logo" id="logo">100% Dora(Fansite)</div>
      <nav>
        <ul>
          <li><a href="index.html" id="nav-home">首頁</a></li>
          <li><a href="events.html" id="nav-events">活動回顧</a></li>
          <li><a href="features.html" id="nav-features">特點介紹</a></li>
          <li><a href="database.html" id="nav-sculpture">資料庫</a></li>
          <li><a href="platforms.html" id="nav-platforms">官方平台</a></li>
        </ul>
      </nav>
      <div class="lang-switch">
        <button onclick="switchLang('ja')">日本語</button>
        <button onclick="switchLang('en')">English</button>
        <button onclick="showChineseModal()">中文</button>
      </div>
    </div>
  </header>

  <div id="chineseModal" class="modal">
    <div class="modal-content">
      <h3>請選擇中文版本</h3>
      <button onclick="switchLang('zh-HK')">繁體中文 (香港)</button>
      <button onclick="switchLang('zh-TW')">繁體中文 (台灣)</button>
      <button onclick="switchLang('zh-CN')">简体中文</button>
      <button onclick="closeModal()" style="background:#ccc; margin-top:20px;">取消</button>
    </div>
  </div>

  <div class="container">
    <h1 id="page-title" class="section-title">人氣造型精選介紹</h1>
    <div class="features-grid" id="features-grid"></div>
    <div class="explore-more" id="explore-more"></div>
  </div>

  <footer>
    <p>This is a fansite for the Doraemon, and is completely unofficial.<br>The information provided here in no way represents Doraemon official and may be inaccurate or out of date.</p>
  </footer>

      },
      {
        image: "https://chinesedora.com/database/wp-content/uploads/2024/07/doraemon-shrugging.jpg",
        titleColor: "#ffaa00",

        source: {

        desc: {

          "zh-CN": "有趣表情包，超适合用来玩梗的无奈脸。"
        }
      },
      {
        image: "https://chinesedora.com/database/wp-content/uploads/2024/07/doraemonthemovie1983-sculpture.jpg",
        titleColor: "#000066",
        title: { ja: "のび太の海底鬼岩城", en: "Doraemon the Movie 1983", "zh-HK": "海底鬼岩城", "zh-TW": "海底鬼岩城", "zh-CN": "海底鬼岩城" },
        source: { 
          ja: "映画🎬のび太の海底鬼岩城 (1983)", 
          en: "Movie🎬\"Nobita and the Castle of the Undersea Devil (1983)\"", 
          "zh-HK": "電影🎬《海底鬼岩城》 (1983)", 
          "zh-TW": "電影🎬《大雄的海底鬼岩城》 (1983)", 
          "zh-CN": "电影🎬《大雄的海底鬼岩城》 (1983)" 
        },
        desc: { 
          ja: "『海底鬼岩城』原作の船長ルック",
          en: "Captain look from the original Castle of the Undersea Devil",
          "zh-HK": "《新・大雄之海底鬼岩城》製作藍本的船長造型",
          "zh-TW": "《新・大雄的海底鬼岩城》製作藍本的船長造型",
          "zh-CN": "《新・大雄的海底鬼岩城》制作蓝本的船长造型"
        }
      }
    ];

    const exploreText = {
      ja: "展覧で他にもユニークなドラえもんを探索しよう～",
      en: "Explore more wonderful Doraemon sculptures at the exhibition~",
      "zh-HK": "在展覽探索更多多啦A夢～",
      "zh-TW": "在展覽探索更多哆啦A夢～",
      "zh-CN": "在展览探索更多哆啦A梦～"
    };

    function getText(obj, lang) {
      if (!obj) return "";
      return obj[lang] || obj.ja || obj.en || "";
    }

    function renderFeatures(lang) {
      const container = document.getElementById('features-grid');
      container.innerHTML = '';
      
      featuresData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'feature-card';
        card.innerHTML = `
          <img src="${item.image}" alt="${getText(item.title, lang)}" onerror="this.src='https://via.placeholder.com/300x260?text=Image+Coming+Soon';">
          <h3 style="color: ${item.titleColor};">${getText(item.title, lang)}</h3>
          <small class="source">${getText(item.source, lang)}</small>
          <p>${getText(item.desc, lang)}</p>
        `;
        container.appendChild(card);
      });
      
      document.getElementById('explore-more').textContent = exploreText[lang] || exploreText["zh-TW"];
    }

    function switchLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      closeModal();
      
      const t = {
        ja: { logo: "100%ドラ(ファンサイト)", home:"HOME", events:"イベントレビュー", features:"注目ポイント", sculpture:"データベース", platforms:"公式サイト", pageTitle:"「ユニークなドラえもん」のセレクション" },
        en: { logo: "100% Dora(Fansite)", home:"HOME", events:"Event Look Back", features:"Features", sculpture:"Database", platforms:"Official Platforms", pageTitle:"Unique Doraemon Selection" },
        "zh-HK": { logo: "100%多啦(粉絲網站)", home:"首頁", events:"活動回顧", features:"特點介紹", sculpture:"資料庫", platforms:"官方平台", pageTitle:"人氣多啦A夢造型精選介紹" },
        "zh-TW": { logo: "100%哆啦(粉絲網站)", home:"首頁", events:"活動回顧", features:"特點介紹", sculpture:"資料庫", platforms:"官方平台", pageTitle:"人氣哆啦A夢造型精選介紹" },
        "zh-CN": { logo: "100%哆啦(粉丝网站)", home:"首页", events:"活动回顾", features:"特点介绍", sculpture:"资料库", platforms:"官方平台", pageTitle:"人气哆啦A梦造型精选介绍" }
      };
      
      const txt = t[lang] || t.ja;
      document.getElementById('logo').textContent = txt.logo;
      document.getElementById('nav-home').textContent = txt.home;
      document.getElementById('nav-events').textContent = txt.events;
      document.getElementById('nav-features').textContent = txt.features;
      document.getElementById('nav-sculpture').textContent = txt.sculpture;
      document.getElementById('nav-platforms').textContent = txt.platforms;
      document.getElementById('page-title').textContent = txt.pageTitle;
      
      renderFeatures(lang);
    }

    function showChineseModal() {
      document.getElementById('chineseModal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('chineseModal').style.display = 'none';
    }

    window.onload = () => switchLang('ja');
  </script>
</body>
</html>
